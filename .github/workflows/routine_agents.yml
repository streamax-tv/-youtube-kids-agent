# Workflow quotidien : YouTube Kids -> CrewAI -> Gemini -> AI visuals -> vidéo -> YouTube

name: Agents IA - YouTube Kids

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:
    inputs:
      media_mode:
        description: "Mode visuel : image = plus économique, video = clips IA"
        required: false
        type: choice
        options:
          - image
          - video
        default: image
      youtube_privacy:
        description: "Visibilité YouTube si OAuth est configuré"
        required: false
        type: choice
        options:
          - private
          - unlisted
          - public
        default: private

concurrency:
  group: youtube-kids-agent
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  generate-script:
    runs-on: ubuntu-latest
    env:
      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      POLLINATIONS_API_KEY: ${{ secrets.POLLINATIONS_API_KEY }}
      MEDIA_MODE: ${{ inputs.media_mode || 'image' }}
      POLLINATIONS_IMAGE_MODEL: flux
      POLLINATIONS_VIDEO_MODEL: veo
      GEMINI_MODEL: gemini-3.6-flash
      TREND_DAYS: "30"
      YOUTUBE_PRIVACY: ${{ inputs.youtube_privacy || 'private' }}

    steps:
      - name: 📥 Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Installer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-video.txt

      - name: 📦 Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-video.txt
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: 🔐 Vérifier les Secrets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          test -n "$GEMINI_API_KEY" || (echo "❌ GEMINI_API_KEY manquant" && exit 1)
          test -n "$YOUTUBE_API_KEY" || (echo "❌ YOUTUBE_API_KEY manquant" && exit 1)
          echo "✅ Les secrets IA sont configurés."
          if [ -n "$POLLINATIONS_API_KEY" ]; then
            echo "✅ Pollinations configuré : génération visuelle IA activée."
          else
            echo "⚠️ POLLINATIONS_API_KEY absent : fallback vidéo graphique utilisé."
          fi
          echo "🎨 Mode média : $MEDIA_MODE"
          if [ -n "$YOUTUBE_CLIENT_ID" ] && [ -n "$YOUTUBE_CLIENT_SECRET" ] && [ -n "$YOUTUBE_REFRESH_TOKEN" ]; then
            echo "✅ YouTube OAuth est configuré : upload automatique activable."
            echo "📺 Confidentialité YouTube : $YOUTUBE_PRIVACY"
          else
            echo "ℹ️ YouTube OAuth n'est pas encore configuré : la vidéo sera seulement produite comme Artifact."
          fi

      - name: 🤖 Générer le script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python main.py

      - name: 🎬 Générer la vidéo
        run: python video_generator.py

      - name: 🔍 Vérifier les résultats
        run: |
          test -s generated_script.txt
          test -s output/youtube_kids_video.mp4
          duration=$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 output/youtube_kids_video.mp4)
          echo "⏱️ Durée vidéo: ${duration}s"
          python -c "d=float('$duration'); assert 44.0 <= d <= 46.0, f'Durée inattendue: {d}s'"
          ls -lh generated_script.txt output/youtube_kids_video.mp4
          echo "✅ Script et vidéo prêts."

      - name: 📦 Publier le script et la vidéo comme Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: youtube-kids-video
          path: |
            generated_script.txt
            output/youtube_kids_video.mp4
          retention-days: 7

      - name: ▶️ Publier automatiquement sur YouTube
        if: ${{ env.YOUTUBE_CLIENT_ID != '' && env.YOUTUBE_CLIENT_SECRET != '' && env.YOUTUBE_REFRESH_TOKEN != '' }}
        run: python youtube_upload.py

      - name: ⚙️ Configurer Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: 💾 Commit et push du script
        run: |
          git add generated_script.txt
          if git diff --cached --quiet; then
            echo "ℹ️ Aucun changement de script à publier."
            exit 0
          fi
          git commit -m "🤖 Génération automatique du script YouTube Kids"
          git pull --rebase origin "${{ github.ref_name }}"
          git push origin HEAD:"${{ github.ref_name }}"
