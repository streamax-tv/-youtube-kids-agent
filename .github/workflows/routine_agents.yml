# Workflow quotidien : YouTube Kids -> CrewAI -> Gemini -> vidéo -> GitHub

name: Agents IA - YouTube Kids

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-script:
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Installer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          python -m pip install crewai google-genai google-api-python-client google-auth-httplib2 google-auth-oauthlib edge-tts
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: 🔐 Vérifier les Secrets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          test -n "$GEMINI_API_KEY" || (echo "❌ GEMINI_API_KEY manquant" && exit 1)
          test -n "$YOUTUBE_API_KEY" || (echo "❌ YOUTUBE_API_KEY manquant" && exit 1)
          echo "✅ Les deux Secrets sont configurés."

      - name: 🤖 Générer le script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python main.py

      - name: 🎬 Générer la vidéo
        run: python video_generator.py

      - name: 🔍 Vérifier les résultats
        run: |
          test -s generated_script.txt
          test -s output/youtube_kids_video.mp4
          ls -lh generated_script.txt output/youtube_kids_video.mp4
          echo "✅ Script et vidéo prêts."

      - name: 📦 Publier la vidéo comme Artifact
        uses: actions/upload-artifact@v4
        with:
          name: youtube-kids-video
          path: output/youtube_kids_video.mp4
          retention-days: 7

      - name: ⚙️ Configurer Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: 💾 Commit et push du script
        run: |
          git add generated_script.txt
          if git diff --cached --quiet; then
            echo "ℹ️ Aucun changement de script à publier."
            exit 0
          fi
          git commit -m "🤖 Génération automatique du script YouTube Kids"
          git push origin HEAD:${{ github.ref_name }}
