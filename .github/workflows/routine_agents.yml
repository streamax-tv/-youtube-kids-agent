# Workflow quotidien : YouTube Kids -> CrewAI -> Gemini -> script -> GitHub

name: Agents IA - YouTube Kids

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-script:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🐍 Installer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          python -m pip install crewai google-genai google-api-python-client google-auth-httplib2 google-auth-oauthlib

      - name: 🔐 Vérifier les Secrets
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          test -n "$GEMINI_API_KEY" || (echo "❌ GEMINI_API_KEY manquant" && exit 1)
          test -n "$YOUTUBE_API_KEY" || (echo "❌ YOUTUBE_API_KEY manquant" && exit 1)
          echo "✅ Les deux Secrets sont configurés."

      - name: 🤖 Générer le script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python main.py

      - name: 🔍 Vérifier le résultat
        run: |
          test -s generated_script.txt
          echo "✅ generated_script.txt est prêt."

      - name: ⚙️ Configurer Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: 💾 Commit et push du script
        run: |
          git add generated_script.txt
          if git diff --cached --quiet; then
            echo "ℹ️ Aucun changement à publier."
            exit 0
          fi
          git commit -m "🤖 Génération automatique du script YouTube Kids"
          git push origin HEAD:${{ github.ref_name }}
